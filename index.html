<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TubeSpace - My Video Library</title>
  <style>
    :root {
      --bg: #0b0b10;
      --panel: #15151e;
      --panel2: #20202b;
      --text: #f5f5f7;
      --muted: #a1a1aa;
      --accent: #ff303b;
      --border: #30303c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 5;
      background: rgba(11, 11, 16, .95);
      border-bottom: 1px solid var(--border);
      padding: 16px 5%;
      display: flex;
      gap: 20px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .brand {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .brand span { color: var(--accent); }

    .search {
      flex: 1;
      max-width: 400px;
    }

    input, button {
      font: inherit;
    }

    input {
      width: 100%;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 13px 15px;
      border-radius: 10px;
      outline: none;
    }

    input:focus { border-color: var(--accent); }

    main {
      max-width: 1250px;
      margin: auto;
      padding: 35px 5%;
    }

    .hero { margin-bottom: 28px; }

    h1 {
      font-size: clamp(28px, 5vw, 42px);
      margin: 0 0 10px;
    }

    p { color: var(--muted); line-height: 1.6; }

    .add-box {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 35px;
    }

    .add-row {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: 700;
      transition: opacity .2s, transform .2s;
    }

    button:hover {
      opacity: .88;
      transform: translateY(-1px);
    }

    .primary {
      background: var(--accent);
      color: white;
      white-space: nowrap;
    }

    .secondary {
      background: var(--panel2);
      color: white;
      border: 1px solid var(--border);
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    h2 { font-size: 23px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(
        auto-fill, minmax(min(100%, 260px), 1fr)
      );
      gap: 22px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      min-width: 0;
    }

    .thumbnail {
      display: block;
      position: relative;
      aspect-ratio: 16 / 9;
      background: #22222b;
      cursor: pointer;
      overflow: hidden;
    }

    .thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .25s;
    }

    .thumbnail:hover img { transform: scale(1.04); }

    .play {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 48, 59, .95);
      color: white;
      border-radius: 12px;
      padding: 10px 17px;
      font-size: 20px;
    }

    .card-body { padding: 14px; }

    .video-title {
      margin: 0 0 12px;
      font-size: 16px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .card-actions {
      display: flex;
      gap: 8px;
    }

    .card-actions button {
      flex: 1;
      padding: 9px 8px;
      font-size: 13px;
    }

    .empty {
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: 16px;
      padding: 45px 15px;
      color: var(--muted);
      grid-column: 1 / -1;
    }

    .count { color: var(--muted); font-size: 14px; }

    footer {
      border-top: 1px solid var(--border);
      padding: 25px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    /* Video player popup */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: rgba(0,0,0,.88);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.open { display: flex; }

    .player-box {
      width: min(900px, 100%);
      background: var(--panel);
      padding: 15px;
      border-radius: 16px;
    }

    .player-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .player-top h3 {
      overflow-wrap: anywhere;
      margin: 0;
    }

    .player {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      border-radius: 8px;
      background: black;
    }

    @media (max-width: 600px) {
      header { padding: 14px 5%; }
      .search { max-width: none; flex-basis: 100%; }
      .add-row { flex-direction: column; }
      .add-row button { width: 100%; }
      main { padding-top: 25px; }
    }
  </style>
</head>
<body>

<header>
  <div class="brand">▶ Tube<span>Space</span></div>
  <div class="search">
    <input id="search" type="search"
      placeholder="Search your videos..."
      aria-label="Search your videos">
  </div>
</header>

<main>
  <section class="hero">
    <h1>Your videos. Your space.</h1>
    <p>Build your own collection of YouTube videos in one place.</p>
  </section>

  <section class="add-box">
    <h2>Add a YouTube video</h2>
    <p>Paste a video link to add it to your personal library.</p>
    <form id="add-form" class="add-row">
      <input id="video-url" type="url"
        placeholder="https://www.youtube.com/watch?v=..."
        aria-label="YouTube video URL" required>
      <button class="primary" type="submit">+ Add Video</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
  </section>

  <section>
    <div class="section-heading">
      <h2>My Library</h2>
      <span class="count" id="count">0 videos</span>
    </div>
    <div class="grid" id="videos"></div>
  </section>
</main>

<footer>
  TubeSpace · Your personal YouTube collection
</footer>

<div class="modal" id="modal" role="dialog"
  aria-modal="true" aria-label="YouTube video player">
  <div class="player-box">
    <div class="player-top">
      <h3 id="player-title">Now playing</h3>
      <button class="secondary" id="close-player"
        type="button" aria-label="Close video player">✕ Close</button>
    </div>
    <iframe class="player" id="iframe"
      title="YouTube video player"
      src="about:blank"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen></iframe>
  </div>
</div>

<script>
  const STORAGE_KEY = "tubespace-videos-v1";

  const form = document.getElementById("add-form");
  const urlInput = document.getElementById("video-url");
  const searchInput = document.getElementById("search");
  const videosElement = document.getElementById("videos");
  const countElement = document.getElementById("count");
  const messageElement = document.getElementById("message");
  const modal = document.getElementById("modal");
  const iframe = document.getElementById("iframe");
  const playerTitle = document.getElementById("player-title");

  let videos = loadVideos();

  function loadVideos() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      return Array.isArray(saved)
        ? saved.filter(v =>
            v && typeof v.id === "string" &&
            typeof v.title === "string" &&
            typeof v.videoId === "string" &&
            /^[a-zA-Z0-9_-]{11}$/.test(v.videoId))
        : [];
    } catch {
      return [];
    }
  }

  function saveVideos() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(videos));
      return true;
    } catch {
      showMessage("Couldn't save changes. Browser storage may be full.");
      return false;
    }
  }

  function showMessage(text, error = false) {
    messageElement.textContent = text;
    messageElement.style.color = error ? "#ff7777" : "#a1a1aa";
  }

  function getVideoId(input) {
    try {
      const url = new URL(input);
      const host = url.hostname.toLowerCase().replace(/^www\./, "");

      if (host === "youtu.be") {
        const id = url.pathname.split("/").filter(Boolean)[0];
        return /^[a-zA-Z0-9_-]{11}$/.test(id || "") ? id : null;
      }

      if (![
        "youtube.com",
        "m.youtube.com",
        "music.youtube.com",
        "youtube-nocookie.com",
        "www.youtube-nocookie.com"
      ].includes(host)) return null;

      let id = null;

      if (url.pathname === "/watch") {
        id = url.searchParams.get("v");
      } else {
        const match = url.pathname.match(
          /^\/(?:embed|shorts|live)\/([a-zA-Z0-9_-]{11})\/?$/
        );
        if (match) id = match[1];
      }

      return /^[a-zA-Z0-9_-]{11}$/.test(id || "") ? id : null;
    } catch {
      return null;
    }
  }

  function addVideo(videoId) {
    if (videos.some(v => v.videoId === videoId)) {
      showMessage("That video is already in your library.", true);
      return;
    }

    const video = {
      id: videoId,
      videoId,
      title: "YouTube Video",
      addedAt: Date.now()
    };

    videos.unshift(video);
    saveVideos();
    renderVideos();
    showMessage("Video added! You can play it from your library.");
  }

  function renderVideos() {
    const query = searchInput.value.trim().toLowerCase();
    const filtered = videos.filter(v =>
      v.title.toLowerCase().includes(query) ||
      v.videoId.toLowerCase().includes(query)
    );

    countElement.textContent =
      `${videos.length} video${videos.length === 1 ? "" : "s"}`;

    videosElement.replaceChildren();

    if (!filtered.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = query
        ? "No videos match your search."
        : "Your library is empty. Add a YouTube link above to get started!";
      videosElement.appendChild(empty);
      return;
    }

    filtered.forEach(video => {
      const card = document.createElement("article");
      card.className = "card";

      const thumbnail = document.createElement("div");
      thumbnail.className = "thumbnail";
      thumbnail.tabIndex = 0;
      thumbnail.setAttribute("role", "button");
      thumbnail.setAttribute("aria-label", `Play ${video.title}`);

      const img = document.createElement("img");
      img.src = `https://i.ytimg.com/vi/${video.videoId}/hqdefault.jpg`;
      img.alt = "";
      img.loading = "lazy";
      img.onerror = () => {
        img.style.display = "none";
      };

      const play = document.createElement("span");
      play.className = "play";
      play.textContent = "▶";

      thumbnail.append(img, play);
      thumbnail.addEventListener("click", () => playVideo(video));
      thumbnail.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          playVideo(video);
        }
      });

      const body = document.createElement("div");
      body.className = "card-body";

      const title = document.createElement("h3");
      title.className = "video-title";
      title.textContent = video.title;

      const actions = document.createElement("div");
      actions.className = "card-actions";

      const edit = document.createElement("button");
      edit.className = "secondary";
      edit.textContent = "Rename";
      edit.addEventListener("click", () => {
        const next = prompt("Enter a name for this video:", video.title);
        if (next === null) return;

        const clean = next.trim().slice(0, 120);
        if (!clean) {
          showMessage("Video name cannot be empty.", true);
          return;
        }

        video.title = clean;
        saveVideos();
        renderVideos();
      });

      const remove = document.createElement("button");
      remove.className = "secondary";
      remove.textContent = "Remove";
      remove.addEventListener("click", () => {
        videos = videos.filter(v => v.id !== video.id);
        saveVideos();
        renderVideos();
        showMessage("Video removed from your library.");
      });

      actions.append(edit, remove);
      body.append(title, actions);
      card.append(thumbnail, body);
      videosElement.appendChild(card);
    });
  }

  function playVideo(video) {
    playerTitle.textContent = video.title;
    modal.classList.add("open");
    iframe.src =
      `https://www.youtube-nocookie.com/embed/${video.videoId}?autoplay=1`;
    document.getElementById("close-player").focus();
  }

  function closePlayer() {
    modal.classList.remove("open");
    iframe.src = "about:blank";
  }

  document.getElementById("close-player")
    .addEventListener("click", closePlayer);

  modal.addEventListener("click", e => {
    if (e.target === modal) closePlayer();
  });

  document.addEventListener("keydown", e => {
    if (e.key === "Escape") closePlayer();
  });

  form.addEventListener("submit", e => {
    e.preventDefault();

    const videoId = getVideoId(urlInput.value.trim());

    if (!videoId) {
      showMessage(
        "Please enter a valid YouTube video link, not a channel or playlist.",
        true
      );
      return;
    }

    addVideo(videoId);
    urlInput.value = "";
  });

  searchInput.addEventListener("input", renderVideos);

  renderVideos();
</script>
